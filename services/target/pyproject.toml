[project]
name = "agentguard-target"
version = "0.1.0"
description = "AgentGuard protected demo shop with a lightweight WAF (Mihari) that publishes security events."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
    "google-cloud-firestore==2.34.1",
    "google-cloud-pubsub==2.42.0",
    "google-auth==2.61.0",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
